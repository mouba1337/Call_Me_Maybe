[project]
name = "callme"
version = "0.1.0"
description = "Constrained Decoding Engine for Function Calling"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "llm_sdk",
]

[tool.uv]
package = false

[tool.uv.sources]
llm_sdk = { path = "./llm_sdk" }

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["^llm_sdk/"]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true